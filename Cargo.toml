[workspace]
resolver = "2"
members = [
    "crates/ainonymous-types",
    "crates/ainonymous-proxy",
    "crates/ainonymous-quic",
    "crates/ainonymous-daemon",
    "crates/ainonymous-cli",
    "crates/ainonymous-mcp",
    # HybridNode (SD-WAN + Holochain + QUIC/mTLS scheduling layer)
    "crates/hybridnode-core",
    "crates/hybridnode-daemon",
    "tools/dna-hashes",
]
# Holochain zomes use separate workspaces and WASM-specific release profiles.

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AInonymous Contributors"]
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
async-stream = "0.3"

# HTTP
axum = { version = "0.7", features = ["ws", "macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
hyper = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# QUIC / networking
quinn = "0.11"
iroh = "0.26"
iroh-net = "0.26"
rustls = "0.23"
rcgen = "0.13"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logs
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "1"
bytes = "1"
zstd = "0.13"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core", "digest"] }
# Native OS keyring (macOS Keychain, Windows Credential Manager, Linux libsecret).
# Used by ainonymous-quic's `secure-keyring` feature to encrypt the seed.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
x509-parser = "0.16"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
config = "0.14"
dirs = "5"
once_cell = "1"
serde_yaml = "0.9"
async-trait = "0.1"
prometheus-client = "0.22"
opentelemetry = { version = "0.22", features = ["trace"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
