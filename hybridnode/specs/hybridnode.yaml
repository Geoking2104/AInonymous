# Complete HybridNode runtime configuration accepted by the Rust types and JSON Schema.
# DNA network seeds/properties belong in hApp manifests; relay settings belong in the conductor.
version: "1.0"
mode: hybridnode # hybridnode | holochain-only | sdwan-only

identity:
  backend: holochain
  keystore: lair

holochain:
  conductor_url: "ws://127.0.0.1:8888" # loopback only
  admin_port: 8888
  app_port: 8889
  app_id: "hybridnode"
  version: "0.7.0"
  bootstrap_mode: private # private | public
  bootstrap_url: "https://bootstrap.internal.example"

sdwan:
  provider: mock # rest/vmanage/velocloud are reserved but not implemented
  # api_url: "https://controller.internal.example"
  # api_token_env: SDWAN_API_TOKEN
  # site_id_env: SDWAN_SITE_ID
  tls_verify: true
  poll_interval_seconds: 30
  sla_thresholds:
    max_latency_ms:
      intra_site: 5
      inter_site_local: 20
      inter_site_remote: 80
    min_bandwidth_mbps:
      intra_site: 10000
      inter_site_local: 1000
      inter_site_remote: 100

quic:
  mtls_strict: true
  bind_addr: "0.0.0.0:0"
  relay_fallback: true
  dscp_marking: 46

scheduler:
  default_strategy: local_first # local_first | round_robin | lowest_latency | highest_bandwidth
  max_inter_site_activation_mb: 50
  max_nodes_per_plan: 3

inference:
  llama_server_port: 9337
  llama_server_host: "127.0.0.1"
  api_port: 9337
  metrics_port: 9338

observability:
  prometheus: true
  prometheus_addr: "127.0.0.1:9338"
  otel_endpoint: ""
  otel_service_name: "hybridnode"
  log_level: info

audit:
  enabled: true
  interval_hours: 6
  auto_warrant: true

security:
  private_network: true # must match bootstrap_mode and the installed DNA properties
  pow_difficulty: 0 # reserved; public-network proof of work is not implemented
  warrant_expiry_days: 30
