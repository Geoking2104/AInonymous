# Minimal development template. Public mode and mock SD-WAN are not production-ready.
version: "1.0"
mode: hybridnode

identity:
  backend: holochain
  keystore: lair

holochain:
  conductor_url: "ws://127.0.0.1:8888"
  admin_port: 8888
  app_port: 8889
  app_id: "my-hybridnode-app"
  version: "0.7.0"
  bootstrap_mode: public

sdwan:
  provider: mock
  tls_verify: true
  poll_interval_seconds: 60

quic:
  mtls_strict: true
  bind_addr: "0.0.0.0:0"
  relay_fallback: true
  dscp_marking: 46

scheduler:
  default_strategy: local_first

inference:
  llama_server_port: 9337
  llama_server_host: "127.0.0.1"
  api_port: 9337
  metrics_port: 9338

observability:
  prometheus: true
  prometheus_addr: "127.0.0.1:9338"
  log_level: info

audit:
  enabled: true
  interval_hours: 6
  auto_warrant: true

security:
  private_network: false
  pow_difficulty: 0
  warrant_expiry_days: 30
