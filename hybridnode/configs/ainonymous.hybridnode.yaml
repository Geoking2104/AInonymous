# Private-network template. Mock SD-WAN keeps it runnable for local Holochain testing.
# Replace the bootstrap endpoint and SD-WAN provider before a controlled pilot.
version: "1.0"
mode: hybridnode

identity:
  backend: holochain
  keystore: lair

holochain:
  conductor_url: "ws://127.0.0.1:8888"
  admin_port: 8888
  app_port: 8889
  app_id: "ainonymous"
  version: "0.7.0"
  bootstrap_mode: private
  bootstrap_url: "https://bootstrap.internal.example"

sdwan:
  provider: mock
  tls_verify: true
  poll_interval_seconds: 30
  sla_thresholds:
    max_latency_ms:
      intra_site: 5
      inter_site_local: 20
      inter_site_remote: 80
    min_bandwidth_mbps:
      intra_site: 10000
      inter_site_local: 1000
      inter_site_remote: 100

quic:
  mtls_strict: true
  bind_addr: "0.0.0.0:0"
  relay_fallback: true
  dscp_marking: 46

scheduler:
  default_strategy: local_first
  max_inter_site_activation_mb: 50
  max_nodes_per_plan: 3

inference:
  llama_server_port: 9337
  llama_server_host: "127.0.0.1"
  api_port: 9337
  metrics_port: 9338

observability:
  prometheus: true
  prometheus_addr: "127.0.0.1:9338"
  otel_endpoint: ""
  otel_service_name: "ainonymous"
  log_level: info

audit:
  enabled: true
  interval_hours: 6
  auto_warrant: true

security:
  private_network: true
  pow_difficulty: 0
  warrant_expiry_days: 30
