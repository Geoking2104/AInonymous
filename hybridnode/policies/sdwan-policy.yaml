# Illustrative SD-WAN policy. Translate it to the target vendor's audited format.
name: ainonymous-hybridnode-policy
version: "1.0"
description: "QoS example for distributed inference and Holochain control traffic"

traffic-classes:
  - name: inference-data
    dscp: 46
    priority: high
    bandwidth-guarantee-percent: 40
    latency-target-ms: 20
  - name: holochain-control
    dscp: 10
    priority: medium
    bandwidth-guarantee-percent: 5
    latency-target-ms: 100
  - name: local-api
    dscp: 0
    priority: normal
    bandwidth-guarantee-percent: 5
  - name: best-effort
    dscp: 0
    priority: low
    bandwidth-guarantee-percent: 50

classifiers:
  - name: quic-inference
    match:
      protocol: udp
      port-range: 49152-65535
      dscp: 46
    assign-class: inference-data
  - name: holochain-app
    match:
      protocol: tcp
      destination-port: [8889]
    assign-class: holochain-control

# Never route the loopback-only conductor admin port through SD-WAN.
