# Observability example. Bind metrics to loopback unless an authenticated proxy protects it.
name: hybridnode-observability
version: "1.0"

prometheus:
  enabled: true
  addr: "127.0.0.1:9338"
  path: /metrics

opentelemetry:
  enabled: false
  endpoint: ""
  service_name: ainonymous-hybridnode
  trace_sampling_rate: 0.1
  propagation: w3c

logging:
  level: info
  format: json
  output: stdout
  exclude_fields:
    - prompt_content
    - activation_data
    - session_token
    - membrane_proof
    - app_auth_token
    - private_key
