# Target model-validation policy. Cross-peer attestation is not fully implemented yet.
name: hybridnode-model-validation
version: "1.0"

local_verification:
  required: true
  hash_algorithm: sha256
  verify_before_service: true
  allow_unverified: false

manifest:
  required_fields:
    - model_name
    - version
    - sha256
    - size_bytes
    - architecture
    - quant_format
    - num_layers

cross_peer_verification:
  status: planned
  desired_minimum_peers: 2
  on_mismatch: quarantine

runtime:
  isolate_untrusted_models: true
  validate_layer_range: true
