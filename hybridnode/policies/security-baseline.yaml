# Deployment policy example. Items marked "operator" are not enforced by this file.
name: hybridnode-security-baseline
version: "1.0"

network:
  quic_mtls_strict: true
  min_tls_version: "1.3"
  conductor_admin_scope: loopback

identity:
  holochain_keystore: lair
  transport_keystore: os-keyring
  bind_transport_key_to_holochain_provenance: true

holochain:
  version: "0.7.0"
  private_network_required: true
  network_bound_membrane_proof: true
  private_bootstrap_and_relay: true # operator responsibility

sdwan:
  api_tls_verify: true
  credentials_from_environment: true

application:
  public_http_enabled: false
  prompts_in_logs: false
  independent_security_review: required-before-production
