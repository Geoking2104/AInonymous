---
manifest_version: "0"
name: ainonymous-core
description: "AInonymous decentralized LLM inference control plane for Holochain 0.7"
roles:
  - name: inference-mesh
    provisioning:
      strategy: create
      deferred: false
    dna:
      path: dnas/inference-mesh/workdir/inference-mesh.dna
      modifiers:
        network_seed: "ainonymous-core-hc07-v2"
        properties: ~
      installed_hash: ~
      clone_limit: 0

  - name: agent-registry
    provisioning:
      strategy: create
      deferred: false
    dna:
      path: dnas/agent-registry/workdir/agent-registry.dna
      modifiers:
        network_seed: "ainonymous-core-hc07-v2"
        properties: ~
      installed_hash: ~
      clone_limit: 0

  - name: blackboard
    provisioning:
      strategy: create
      deferred: false
    dna:
      path: dnas/blackboard/workdir/blackboard.dna
      modifiers:
        network_seed: "ainonymous-core-hc07-v2"
        properties: ~
      installed_hash: ~
      clone_limit: 0
