# Holochain 0.7.0 local test conductor configuration.
# Run from the repository root with:
# holochain -c scripts/testnet/conductor_t51.yaml

data_root_path: /tmp/ainonymous-t51/conductor-data
wasm_backend: ~

keystore:
  type: danger_test_keystore

admin_interfaces:
  - driver:
      type: websocket
      port: 65000
      danger_bind_addr: ~
      allowed_origins: "*"

network:
  base64_auth_material_bootstrap: ~
  base64_auth_material_relay: ~
  bootstrap_url: https://bootstrap.holo.host
  relay_url: ~
  request_timeout_s: 60
  target_arc_factor: 1
  report: none
  advanced: ~

db_sync_level: Off
tuning_params: ~
tracing_scope: ~
