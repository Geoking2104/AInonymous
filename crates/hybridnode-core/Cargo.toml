[package]
name = "hybridnode-core"
version = "0.1.0"
edition = "2021"
description = "HybridNode: SD-WAN + Holochain + QUIC/mTLS scheduling layer for AInonymous"
license = "MIT OR Apache-2.0"

[features]
default = ["mock-sdwan"]
mock-sdwan = []
vmanage = ["reqwest"]
velocloud = ["reqwest"]
private-network = []

[dependencies]
# Holochain client — alignee sur ainonymous-daemon (0.8.1). La 0.6 (utilisee
# hors-workspace, cf. HYBRIDNODE_APPLY.md) tire holochain_serialized_bytes
# 0.0.55 qui epingle serde en =1.0.203, incompatible avec le reste du
# workspace (serde 1.0.228 via holochain_types 0.6.3). Une fois dans le
# meme workspace Cargo que ainonymous-daemon, un seul resolveur de deps
# s'applique : les deux crates doivent partager la meme version.
holochain_client = { version = "0.8.1", default-features = false }
hdk = { version = "0.6.1", optional = true }

# Networking — alignes sur workspace.dependencies pour eviter les conflits de
# resolution (ex: derive_more entre iroh 0.26 et iroh-net 0.23 pin isole)
iroh-net = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true, features = ["ring"] }
ed25519-dalek = { workspace = true }

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

# HTTP (for SD-WAN REST APIs)
reqwest = { workspace = true, optional = true }

# Observability
prometheus-client = { workspace = true }
opentelemetry = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Utilities
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
