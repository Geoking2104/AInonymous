[package]
name = "hybridnode-core"
version = "0.1.0"
edition = "2021"
description = "HybridNode: SD-WAN + Holochain + QUIC/mTLS scheduling layer for AInonymous"
license = "MIT OR Apache-2.0"

[dependencies]
# Holochain 0.7-compatible client and HDK. Keep this aligned with the daemon
# because both crates share the root Cargo resolver and lockfile.
holochain_client = { version = "=0.9.0", default-features = false }
hdk = { version = "=0.7.0", optional = true }

# Networking — alignes sur workspace.dependencies pour eviter les conflits de
# resolution (ex: derive_more entre iroh 0.26 et iroh-net 0.23 pin isole)
iroh-net = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true, features = ["ring"] }
ed25519-dalek = { workspace = true }

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

# Observability
prometheus-client = { workspace = true }
opentelemetry = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Utilities
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
