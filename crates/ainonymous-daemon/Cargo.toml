[package]
name = "ainonymous-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ainonymous-daemon"
path = "src/main.rs"

[dependencies]
ainonymous-types  = { path = "../ainonymous-types" }
ainonymous-quic   = { path = "../ainonymous-quic", features = ["secure-keyring"] }
quinn       = { workspace = true }

tokio       = { workspace = true }
futures     = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
toml        = { workspace = true }
anyhow      = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }
uuid        = { workspace = true }
reqwest     = { workspace = true }
axum        = { workspace = true }
tower-http  = { workspace = true }
config      = { workspace = true }
dirs        = { workspace = true }
chrono      = { workspace = true }
base64      = { workspace = true }
hex         = { workspace = true }
ed25519-dalek = { workspace = true }
once_cell   = { workspace = true }

# Holochain 0.7-compatible Rust client stack. Disabling default features keeps
# signing in-process and avoids embedding a conductor in the daemon.
holochain_client     = { version = "=0.9.0", default-features = false }
holochain_zome_types = "=0.7.0"
holochain_types      = { version = "=0.7.0", default-features = false }
