name: CI

on:
  push:
    branches: [main, 'feat/**', 'codex/**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Native checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust 1.88 with Clippy
        uses: dtolnay/rust-toolchain@1.88
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake clang libclang-dev libdbus-1-dev pkg-config libssl-dev

      - name: Check workspace
        run: cargo check --locked --workspace

      - name: Test workspace
        run: cargo test --locked --workspace

      - name: Run Clippy
        run: cargo clippy --locked --workspace -- -A dead_code -A unused

  bundles:
    name: Holochain 0.7 bundles and hashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust 1.88 and WASM target
        uses: dtolnay/rust-toolchain@1.88
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            dnas/ainonymous-core -> target
            dnas/hybridnode -> target
          key: hc07-bundles

      - name: Install Holochain 0.7.0 tools with checksum verification
        run: |
          install -d .bin
          curl --fail --location --silent --show-error \
            https://github.com/holochain/holochain/releases/download/holochain-0.7.0/hc-x86_64-unknown-linux-gnu \
            --output .bin/hc
          echo "f1eca56b97bc2261324e00e0e86a274f7dc8363f73264e697fd0c0216b2aac23  .bin/hc" \
            | sha256sum --check --strict
          chmod 0755 .bin/hc
          .bin/hc --version
          curl --fail --location --silent --show-error \
            https://github.com/holochain/holochain/releases/download/holochain-0.7.0/holochain-x86_64-unknown-linux-gnu \
            --output .bin/holochain
          echo "ffa40a0c6fab5ce062c4af76328dfe2de143256ddf791a504d72bca698a9ba20  .bin/holochain" \
            | sha256sum --check --strict
          chmod 0755 .bin/holochain
          .bin/holochain --version

      - name: Validate conductor and provisioning CLI surface
        run: |
          .bin/holochain --config-schema > conductor.schema.json
          python -m pip install --disable-pip-version-check PyYAML jsonschema
          python -c "import json,yaml,jsonschema; jsonschema.validate(yaml.safe_load(open('deploy/containers/holochain/conductor.yaml')), json.load(open('conductor.schema.json')))"
          .bin/hc client call --help | tee hc-client-call-help.txt
          grep -q new-agent hc-client-call-help.txt
          grep -q list-app-ws hc-client-call-help.txt
          grep -q install-app hc-client-call-help.txt
          .bin/hc client call --port 1 install-app --help | grep -q -- --agent-key
          .bin/hc client call --port 1 add-app-ws --help | grep -q -- --installed-app-id
          sh -n deploy/containers/holochain/entrypoint.sh
          bash -n scripts/build-happ.sh
          bash -n scripts/reprovision-containers.sh

      - name: Build and pack both hApps
        env:
          HC_BIN: ${{ github.workspace }}/.bin/hc
        run: bash scripts/build-happ.sh release

      - name: Print effective DNA hashes
        run: |
          cargo run --locked -p dna-hashes -- \
            dnas/ainonymous-core/dnas/inference-mesh/workdir/inference-mesh.dna \
            dnas/ainonymous-core/dnas/agent-registry/workdir/agent-registry.dna \
            dnas/ainonymous-core/dnas/blackboard/workdir/blackboard.dna \
            dnas/hybridnode/dnas/hybridnode-core/workdir/hybridnode-core.dna \
            | tee dna-hashes.txt

      - name: Stage Compose secret and validate configuration
        run: |
          install -d -m 0700 deploy/secrets
          printf '%s' 'ci-only-placeholder' > deploy/secrets/holochain_keystore_password
          docker compose --project-name ainonymous-hc07-v3 config --quiet

      - name: Upload bundles and hash report
        uses: actions/upload-artifact@v4
        with:
          name: holochain-0.7-v3-bundles
          if-no-files-found: error
          path: |
            dnas/ainonymous-core/ainonymous-core.happ
            dnas/hybridnode/hybridnode.happ
            dna-hashes.txt

  configuration:
    name: Configuration schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install --disable-pip-version-check PyYAML jsonschema
      - name: Validate reference configurations
        run: |
          python scripts/hybridnode/validate_config.py \
            hybridnode/configs/ainonymous.hybridnode.yaml \
            hybridnode/configs/generic-project.hybridnode.yaml
