name: ainonymous-hc07-v3

x-runtime-security: &runtime-security
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m

services:
  holochain:
    <<: *runtime-security
    build:
      context: .
      dockerfile: deploy/containers/holochain/Dockerfile
      args:
        HOLOCHAIN_VERSION: "0.7.0"
        HOLOCHAIN_SHA256: "ffa40a0c6fab5ce062c4af76328dfe2de143256ddf791a504d72bca698a9ba20"
        HC_SHA256: "f1eca56b97bc2261324e00e0e86a274f7dc8363f73264e697fd0c0216b2aac23"
    environment:
      HOLOCHAIN_KEYSTORE_PASSWORD_FILE: /run/secrets/holochain_keystore_password
      RUST_LOG: ${HOLOCHAIN_LOG_LEVEL:-info}
    secrets:
      - holochain_keystore_password
    volumes:
      - holochain-data-hc07-v3:/var/lib/holochain
      - ./dnas/ainonymous-core/ainonymous-core.happ:/opt/happs/ainonymous-core.happ:ro
      - ./dnas/hybridnode/hybridnode.happ:/opt/happs/hybridnode.happ:ro
    ports:
      - "127.0.0.1:${AINONYMOUS_API_PORT:-8890}:8892/tcp"
      - "${AINONYMOUS_QUIC_PORT:-9000}:9000/udp"
    healthcheck:
      test: ["CMD", "test", "-f", "/var/lib/holochain/.provisioned-hc07-v3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  ainonymous-daemon:
    <<: *runtime-security
    build:
      context: .
      dockerfile: docker/daemons.Dockerfile
      target: ainonymous-daemon
    network_mode: service:holochain
    depends_on:
      holochain:
        condition: service_healthy
    volumes:
      - ainonymous-models:/data/models
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8890/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  hybridnode-daemon:
    <<: *runtime-security
    build:
      context: .
      dockerfile: docker/daemons.Dockerfile
      target: hybridnode-daemon
    network_mode: service:holochain
    depends_on:
      holochain:
        condition: service_healthy
    command: ["--config", "/etc/hybridnode/config.yaml"]
    volumes:
      - ./hybridnode/configs/ainonymous.hybridnode.yaml:/etc/hybridnode/config.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9338/metrics"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  holochain-data-hc07-v3:
  ainonymous-models:

secrets:
  holochain_keystore_password:
    file: ./deploy/secrets/holochain_keystore_password
