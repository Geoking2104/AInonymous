[package]
name = "relay-android-spike"
version = "0.0.1"
edition = "2021"
publish = false

# Projet autonome : hors du workspace racine (dépendances Tauri non souhaitées en CI).
[workspace]

[lib]
name = "relay_android_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
holochain-android-probe = { path = "../../holochain-probe", optional = true }
tauri-plugin-log = "2"
log = "0.4"

[features]
default = []
# Embarque le conducteur Holochain 0.7.0 (lair in-process) dans l'APK.
holochain = ["dep:holochain-android-probe"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
